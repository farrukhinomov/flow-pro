name: Feature request
description: A new capability or an improvement to an existing one.
title: "feat: "
labels: ["type:feature"]
projects: ["farrukhinomov/3"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: Observable outcomes that mean this is finished.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
