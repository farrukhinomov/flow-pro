name: CLA

# Every outside contributor signs the contributor licence agreement (CLA.md)
# once, by commenting on their pull request. Signatures are stored in the
# cla-signatures branch.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-24.04
    steps:
      # Reads the PR author and comments through the API. It never checks out
      # PR code, which keeps pull_request_target safe for pull requests from
      # forks.
      - name: Check CLA signature
        if: >
          github.event_name == 'pull_request_target'
          || github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/farrukhinomov/flow-pro/blob/HEAD/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: farrukhinomov,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
